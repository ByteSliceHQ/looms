<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -40 640 500" width="640" height="500" class="looms-art " data-theme="light" role="img" aria-labelledby="_R_0_-title _R_0_-desc" fill="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><title id="_R_0_-title">Durable waits</title><desc id="_R_0_-desc">A continuous thread pauses over recorded layers. A matching signal descends from above and the thread continues. A thread parks with its progress preserved in the log. A matching approval, webhook, or timer wakes it to continue.</desc><g stroke="#edf0f4" fill="none" stroke-width="0.7"><g><path d="M337.3205080756888,110 L-9.089653438086657,310"></path><path d="M302.6794919243112,110 L649.0896534380867,310"></path></g><g><path d="M389.28203230275506,140 L42.87187078897966,340"></path><path d="M250.71796769724492,140 L597.1281292110203,340"></path></g><g><path d="M441.2435565298214,170 L94.83339501604596,370"></path><path d="M198.7564434701786,170 L545.166604983954,370"></path></g><g><path d="M493.2050807568877,200 L146.79491924311228,400"></path><path d="M146.79491924311228,200 L493.2050807568877,400"></path></g><g><path d="M545.166604983954,230 L198.7564434701786,430"></path><path d="M94.83339501604596,230 L441.2435565298214,430"></path></g><g><path d="M597.1281292110203,260 L250.71796769724492,460"></path><path d="M42.87187078897966,260 L389.28203230275506,460"></path></g><g><path d="M649.0896534380867,290 L302.6794919243112,490"></path><path d="M-9.089653438086657,290 L337.3205080756888,490"></path></g></g><path d="M150.25902085825004,95 L280.16283142591584,170" fill="none" stroke="#929ba9" stroke-width="1"></path><path d="M143.33081762797454,99 L273.2346281956403,174" fill="none" stroke="#929ba9" stroke-width="1"></path><path d="M136.402614397699,103 L266.3064249653648,178" fill="none" stroke="#627b9b" stroke-width="1.4"></path><path d="M129.4744111674235,107 L259.3782217350893,182" fill="none" stroke="#929ba9" stroke-width="1"></path><path d="M122