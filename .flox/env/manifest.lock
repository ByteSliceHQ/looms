    "schema-version": "1.13.0",
    "install": {
      "bun": {
        "pkg-path": "bun"
      },
      "curl": {
        "pkg-path": "curl"
      },
      "nodejs": {
        "pkg-path": "nodejs"
      },
      "postgresql": {
        "pkg-path": "postgresql"
      },
      "unzip": {
        "pkg-path": "unzip"
      }
    },
    "vars": {
      "LOOMS_HOST": "127.0.0.1",
      "LOOMS_PORT": "4242"
    },
    "hook": {
      "on-activate": "  PGDATA=\"$FLOX_ENV_CACHE/postgres\"\n  mkdir -p \"$PGDATA\"\n  if [ ! -f \"$PGDATA/PG_VERSION\" ]; then\n    initdb -D \"$PGDATA\" --auth=trust --username=looms\n  fi\n\n  # Install S2 CLI into the flox cache (idempotent) and put it on PATH.\n  export S2_INSTALL_PREFIX=\"$FLOX_ENV_CACHE/s2\"\n  bash \"$FLOX_ENV_PROJECT/scripts/install-s2-cli.sh\"\n  export PATH=\"$S2_INSTALL_PREFIX/bin:$PATH\"\n\n  echo \"Looms: bun install && bun run verify\"\n  echo \"Demo:  bun run demo\"\n"
    },
    "profile": {
      "common": "  # Keep S2 CLI available in nested shells / flox activate -c\n  if [ -n \"${FLOX_ENV_CACHE:-}\" ] && [ -d \"$FLOX_ENV_CACHE/s2/bin\" ]; then\n    case \":${PATH}:\" in\n      *\":$FLOX_ENV_CACHE/s2/bin:\"*) ;;\n      *) export PATH=\"$FLOX_ENV_CACHE/s2/bin:$PATH\" ;;\n    esac\n  fi\n"
    },
    "options": {},
    "services": {
      "postgres": {
        "command": "  PGDATA=\"$FLOX_ENV_CACHE/postgres\"\n  pg_ctl -D \"$PGDATA\" -o \"-p 5432 -h 127.0.0.1\" start -w\n  createdb -h 127.0.0.1 -p 5432 -U looms looms 2>/dev/null || true\n  tail -f /dev/null\n"
      }
    }
  },
