schema-version = "1.13.0"

[install]
bun.pkg-path = "bun"
# Optional host index for actor directory / review inbox / timer wakes
postgresql.pkg-path = "postgresql"
# Used by scripts/install-s2-cli.sh (s2-lite for the LiveStore demo)
curl.pkg-path = "curl"
unzip.pkg-path = "unzip"

[vars]
LOOMS_HOST = "127.0.0.1"
LOOMS_PORT = "4242"
# In-memory by default. For the LiveStore demo / s2-lite, export (or copy .env.example):
# LOOMS_S2_ACCESS_TOKEN = "local"
# LOOMS_S2_BASIN = "looms-demo"
# LOOMS_S2_ENDPOINT = "http://127.0.0.1:8080"
# LOOMS_DATABASE_URL = "postgresql://looms@127.0.0.1:5432/looms"

[hook]
on-activate = '''
  PGDATA="$FLOX_ENV_CACHE/postgres"
  mkdir -p "$PGDATA"
  if [ ! -f "$PGDATA/PG_VERSION" ]; then
    initdb -D "$PGDATA" --auth=trust --username=looms
  fi

  # Install S2 CLI into the flox cache (idempotent) and put it on PATH.
  export S2_INSTALL_PREFIX="$FLOX_ENV_CACHE/s2"
  bash "$FLOX_ENV_PROJECT/scripts/install-s2-cli.sh"
  export PATH="$S2_INSTALL_PREFIX/bin:$PATH"

  echo "Looms: bun install && bun run verify"
  echo "Demo:  bun run demo"
'''

[profile]
common = '''
  # Keep S2 CLI available in nested shells / flox activate -c
  if [ -n "${FLOX_ENV_CACHE:-}" ] && [ -d "$FLOX_ENV_CACHE/s2/bin" ]; then
    case ":${PATH}:" in
      *":$FLOX_ENV_CACHE/s2/bin:"*) ;;
      *) export PATH="$FLOX_ENV_CACHE/s2/bin:$PATH" ;;
    esac
  fi
'''

[services]
# Optional Postgres secondary index (event order of truth remains S2 / memory store)
postgres.command = '''
  PGDATA="$FLOX_ENV_CACHE/postgres"
  pg_ctl -D "$PGDATA" -o "-p 5432 -h 127.0.0.1" start -w
  createdb -h 127.0.0.1 -p 5432 -U looms looms 2>/dev/null || true
  tail -f /dev/null
'''
# Optional s2-lite (auto-started by demo, or run manually):
#   flox activate -- bun run demo
# Or: s2 lite --port 8080 --local-root "$FLOX_ENV_CACHE/s2-lite"

[options]
# systems left default
